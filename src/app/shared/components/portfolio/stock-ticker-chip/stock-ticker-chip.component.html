<mat-chip class="ticker-chip">
    <span [ngStyle]="{fontSize: fontSize }"><b>{{ stock.symbol }}</b></span>
    <span [ngStyle]=" {'color': priceColor, fontSize: largeTicker ? '1.5rem' : ''}">
        {{ price | currency }}
    </span>
    <span [ngStyle]="{'color': priceColor, fontSize: largeTicker ? '1rem': ''}">
        ({{ priceChangePercent }})
    </span>
</mat-chip>
